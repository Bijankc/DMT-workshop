name: Deploy to GitHub Pages

on:
  push:
    branches: [main, add-ga4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_DIR: DMt workshop assignment

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject GA4 Measurement ID
        env:
          GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          if [ -n "$GA_ID" ]; then
            sed -i "s/G-XXXXXXXXXX/$GA_ID/" "$SITE_DIR/js/ga-config.js"
            echo "Using Measurement ID from repository variable."
          else
            echo "GA_MEASUREMENT_ID variable not set; using value in js/ga-config.js."
          fi
          cat "$SITE_DIR/js/ga-config.js" | tail -n 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - id: deployment
        uses: actions/deploy-pages@v4
